services:
  agentic-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-ai-platform:local
    container_name: agentic-ai-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_DATABASE_PATH: /app/data/agentic_platform.db
      AGENT_SEMANTIC_MEMORY_PATH: /app/data/semantic_memory
    ports:
      - "8000:8000"
    volumes:
      - agentic-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agentic-data:
